apiVersion: v1
kind: Namespace
metadata:
  name: agentforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentforge
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/agentforge-api:latest
          ports:
            - containerPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agentforge
spec:
  replicas: 3
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/agentforge-worker:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agentforge
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/agentforge-frontend:latest
          ports:
            - containerPort: 3000
